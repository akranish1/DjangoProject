{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}{{ SITE_TAGLINE }}{% endblock %}">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%234f46e5'/><path d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include "partials/icons.html" %}
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% block body %}{% endblock %}
  {% include "partials/messages.html" %}
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
