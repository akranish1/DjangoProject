{% extends "base_shell.html" %}
{% block title %}Check your email · {{ SITE_NAME }}{% endblock %}

{% block body %}
<div class="auth-shell" style="grid-template-columns:1fr">
  <main class="auth-main" id="main-content">
    <div class="auth-card">
      <div class="card card-pad text-center">
        <div class="empty-art" style="margin:0 auto 16px"><svg aria-hidden="true"><use href="#i-megaphone"></use></svg></div>
        <h1 style="font-size:1.4rem">Check your inbox</h1>
        <p class="muted">If an account exists for that address, a password reset link is on its way. The link expires in one hour.</p>
        <a class="btn btn-secondary" href="{% url 'accounts:login' %}">Back to sign in</a>
      </div>
    </div>
  </main>
</div>
{% endblock %}
