{% extends "base_shell.html" %}
{% block title %}Password updated · {{ SITE_NAME }}{% endblock %}

{% block body %}
<div class="auth-shell" style="grid-template-columns:1fr">
  <main class="auth-main" id="main-content">
    <div class="auth-card">
      <div class="card card-pad text-center">
        <div class="empty-art" style="margin:0 auto 16px"><svg aria-hidden="true"><use href="#i-shield"></use></svg></div>
        <h1 style="font-size:1.4rem">Password updated</h1>
        <p class="muted">Your password has been changed successfully. Sign in with your new credentials.</p>
        <a class="btn btn-primary" href="{% url 'accounts:login' %}">Sign in</a>
      </div>
    </div>
  </main>
</div>
{% endblock %}
