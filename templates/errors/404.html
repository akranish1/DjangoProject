{% extends "base.html" %}
{% block title %}Page not found · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section" style="padding-top:70px">
  <div class="container text-center" style="max-width:620px">
    <div class="empty-art" style="margin:0 auto 18px"><svg aria-hidden="true"><use href="#i-search"></use></svg></div>
    <h1>404 · Page not found</h1>
    <p class="lead">The page you were looking for has moved, was unpublished, or never existed. Try searching for a live event instead.</p>
    <div class="row" style="justify-content:center">
      <a class="btn btn-primary" href="{% url 'events:list' %}">Discover events</a>
      <a class="btn btn-secondary" href="{% url 'core:home' %}">Go home</a>
    </div>
  </div>
</section>
{% endblock %}
